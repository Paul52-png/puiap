<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="calculator-container">
        <div class="calc-screen">0</div>

        <div class="calc-grid">
            <div class="btn ac span-2">AC</div>
            <div class="btn operator">/</div>
            <div class="btn operator">x</div>

            <div class="btn">7</div>
            <div class="btn">8</div>
            <div class="btn">9</div>
            <div class="btn operator">-</div>

            <div class="btn">4</div>
            <div class="btn">5</div>
            <div class="btn">6</div>
            <div class="btn operator">+</div>

            <div class="btn">1</div>
            <div class="btn">2</div>
            <div class="btn">3</div>
            <div class="btn equals row-span-2">=</div>

            <div class="btn span-2">0</div>
            <div class="btn">.</div>
        </div>
    </div>

</body>
</html>
